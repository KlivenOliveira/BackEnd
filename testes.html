<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Selenium + Bootstrap</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
        /* Ajuste visual do select2 com bootstrap */
        .select2-container .select2-selection--single {
            height: 38px;
            padding: 5px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">Testes de Selenium</h2>

    <div class="row g-4">

        <!-- BLOCO 1 -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    Bloco 1
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <label for="testeTexto" class="form-label">Texto 1</label>
                        <input type="text" id="testeTexto" class="form-control">
                    </div>

                                <!-- SELECT2 -->
                    <label for="testeSelect2" class="form-label">Select2</label>
                    <select id="testeSelect2" class="form-select mb-3">
                        <option value="">Selecione</option>
                        <option value="1">Opção 1</option>
                        <option value="2">Opção 2</option>
                        <option value="3">Opção 3</option>
                        <option value="4">Opção 4</option>
                    </select>
                    
                    <div class="mb-3">
                        <label for="testeSelect" class="form-label">Select 1</label>
                        <select id="testeSelect" class="form-select">
                            <option value="">Selecione</option>
                            <option value="1">Opção 1</option>
                            <option value="2">Opção 2</option>
                            <option value="3">Opção 3</option>
                            <option value="4">Opção 4</option>
                        </select>
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="testeCHK1">
                        <label class="form-check-label" for="testeCHK1">
                            Checkbox 1
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioGrupo1" id="radio1">
                        <label class="form-check-label" for="radio1">
                            Radio 1
                        </label>
                    </div>

                          <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioGrupo1" id="radio2">
                        <label class="form-check-label" for="radio2">
                            Radio 2
                        </label>
                    </div>

                </div>
            </div>
        </div>

        <!-- BLOCO 2 -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    Bloco 2
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <label for="testeTexto2" class="form-label">Texto 2</label>
                        <input type="text" id="testeTexto2" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="testeTexto3" class="form-label">Texto 3</label>
                        <input type="text" id="testeTexto3" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="testeTexto4" class="form-label">Texto 4</label>
                        <input type="text" id="testeTexto4" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="testeSelect3" class="form-label">Select 2</label>
                        <select id="testeSelect3" class="form-select">
                            <option value="">Selecione</option>
                            <option value="1">Opção 1</option>
                            <option value="2">Opção 2</option>
                            <option value="3">Opção 3</option>
                            <option value="4">Opção 4</option>
                        </select>
                    </div>
                    <label>Preencha  checkbox</label>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="testeCHK2">
                        <label class="form-check-label" for="testeCHK2">
                            Checkbox 2
                        </label>
                    </div>
                    <label for="">Escolha um radio</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioGrupo2" id="radio2">
                        <label class="form-check-label" for="radio2">
                            Radio 2
                        </label>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="radioGrupo2" id="radio3">
                        <label class="form-check-label" for="radio3">
                            Radio 3
                        </label>
                    </div>

                    <button id="btnTeste" class="btn btn-info w-100" onclick="alert('Apertado')">
                        Pressione
                    </button>

                </div>
            </div>
        </div>

    </div>
</div>

<div class="container mt-4">
    <h2>Campo Zoom (Fluig-like)</h2>

    <div class="mb-3">
        <label class="form-label">Produto</label>
        <div class="input-group">
            <input type="text" id="zoomProduto" class="form-control" readonly>
            <button class="btn btn-outline-secondary" id="btnZoomProduto">
                🔍
            </button>
        </div>
    </div>
</div>


<div class="modal fade" id="modalZoom" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Selecionar Produto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <table class="table table-hover" id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-cod="P001" data-desc="Teclado Mecânico">
                            <td>P001</td>
                            <td>Teclado Mecânico</td>
                        </tr>
                        <tr data-cod="P002" data-desc="Mouse Gamer">
                            <td>P002</td>
                            <td>Mouse Gamer</td>
                        </tr>
                        <tr data-cod="P003" data-desc="Monitor 27">
                            <td>P003</td>
                            <td>Monitor 27"</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (opcional, mas bom ter) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('modalZoom'));

    document.getElementById('btnZoomProduto').addEventListener('click', function () {
        modal.show();
    });

    document.querySelectorAll('#tabelaProdutos tbody tr').forEach(tr => {
        tr.addEventListener('click', function () {
            const cod = this.getAttribute('data-cod');
            const desc = this.getAttribute('data-desc');

            document.getElementById('zoomProduto').value = cod + ' - ' + desc;
            modal.hide();
        });
    });
</script>

</body>
</html>
